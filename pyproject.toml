[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-eval"
version = "0.1.0"
description = "A pytest-like evaluation harness for LLM agents."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "agent-eval contributors" }]
keywords = ["llm", "agent", "evaluation", "llmops", "testing", "langgraph"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.7,<3",
  "pyyaml>=6.0,<7",
  "typer>=0.12,<1",
  "rich>=13.7,<15",
  "jinja2>=3.1,<4",
]

[project.optional-dependencies]
ollama = ["httpx>=0.27,<1"]
langgraph = ["langgraph>=0.2,<1"]
dashboard = ["fastapi>=0.111,<1", "uvicorn>=0.30,<1"]
dev = [
  "pytest>=8.2,<9",
  "pytest-asyncio>=0.23,<2",
  "pytest-cov>=5.0,<7",
  "ruff>=0.5,<1",
  "mypy>=1.10,<2",
]

[project.scripts]
agent-eval = "agent_eval.cli.main:main"

[project.urls]
Homepage = "https://github.com/your-org/agent-eval-harness"
Repository = "https://github.com/your-org/agent-eval-harness"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_eval"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
markers = [
  "ollama: requires a running local Ollama server",
  "langgraph: requires the langgraph extra",
]
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF", "ANN", "D", "ASYNC"]
# ANN401 is wrong for this project: JSON payloads, agent outputs and scrubbed
# structures are legitimately `Any`-typed. The rule is re-enabled nowhere.
# D107 is redundant under the Google convention: our `__init__` methods already
# document every parameter in an `Args:` section, which D107 does not count.
# B008 is intrinsic to Typer: options and arguments are declared by calling
# typer.Option()/typer.Argument() in the parameter default.
ignore = ["D203", "D213", "ANN401", "D107", "B008"]

[tool.ruff.lint.per-file-ignores]
# Test doubles deliberately implement loosely-typed protocols and omit docstrings.
# ASYNC109 is excluded because fake HTTP clients must mirror `httpx`'s
# `timeout=` keyword, not asyncio's own parameter name.
"tests/**" = ["D100", "D101", "D102", "D103", "D104", "ANN", "ARG", "ASYNC109"]
"scripts/**" = ["D100", "D103", "ANN", "E501"]
"**/__init__.py" = ["D104"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
mypy_path = "src"
packages = ["agent_eval"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[[tool.mypy.overrides]]
# PyYAML ships no inline types; its stubs are a dev-only dependency.
module = ["yaml", "yaml.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Optional adapters ship no type information of their own and are imported
# lazily, so mypy does not follow them by default.
module = ["agent_eval.integrations.langgraph.*"]
ignore_missing_imports = true